<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="filmGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0a04b" />
      <stop offset="100%" stop-color="#e2542a" />
    </linearGradient>
  </defs>
  <!-- Корпус кинопленки -->
  <rect x="2" y="2" width="28" height="28" rx="5" fill="#151210" stroke="#f0a04b" stroke-width="1.5" />
  <!-- Перфорация слева -->
  <rect x="4.5" y="5" width="3" height="3.5" rx="1" fill="#f0a04b" />
  <rect x="4.5" y="11" width="3" height="3.5" rx="1" fill="#f0a04b" />
  <rect x="4.5" y="17" width="3" height="3.5" rx="1" fill="#f0a04b" />
  <rect x="4.5" y="23" width="3" height="3.5" rx="1" fill="#f0a04b" />
  <!-- Перфорация справа -->
  <rect x="24.5" y="5" width="3" height="3.5" rx="1" fill="#f0a04b" />
  <rect x="24.5" y="11" width="3" height="3.5" rx="1" fill="#f0a04b" />
  <rect x="24.5" y="17" width="3" height="3.5" rx="1" fill="#f0a04b" />
  <rect x="24.5" y="23" width="3" height="3.5" rx="1" fill="#f0a04b" />
  <!-- Кадры кинопленки по центру -->
  <rect x="9.5" y="5" width="13" height="9.5" rx="2" fill="url(#filmGlow)" />
  <rect x="9.5" y="17" width="13" height="9.5" rx="2" fill="url(#filmGlow)" />
  <!-- Разделитель кадров -->
  <line x1="9.5" y1="15.75" x2="22.5" y2="15.75" stroke="#151210" stroke-width="1.5" />
</svg>
